name: Aternos AFK Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni yuklash
        uses: actions/checkout@v3

      - name: Node.js o'rnatish
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Kutubxonalarni o'rnatish
        run: npm install mineflayer

      - name: Botni ishga tushirish
        run: node bot.js
        
